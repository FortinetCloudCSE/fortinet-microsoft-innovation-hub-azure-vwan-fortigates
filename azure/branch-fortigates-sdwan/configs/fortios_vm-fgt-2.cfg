--==FGTCONF==
Content-Type: text/plain; charset="us-ascii"
MIME-Version: 1.0
Content-Transfer-Encoding: 7bit
Content-Disposition: attachment; filename="config"

config system global
    set admintimeout 120
    set allow-traffic-redirect disable
end

config system sdn-connector
    edit "AzureSDN"
        set type azure
    next
end

config vpn ssl settings
    set port 7443
end

config system api-user
    edit "apiadmin"
        set api-key f6mkD5rR4NKWFnptdgh7sOl6CnRVby
        set accprofile "super_admin"
        set vdom "root"
    next
end

config router static
    edit 1
        set device port1
        set gateway 172.16.0.1
    next
    edit 2
        set device port2
        set dst 172.16.0.0/20
        set gateway 172.16.0.65
    next
    edit 3
        set device port2
        set dst 168.63.129.16 255.255.255.255
        set gateway 172.16.0.65
    next
    edit 4
        set device port1
        set dst 168.63.129.16 255.255.255.255
        set gateway 172.16.0.1
    next
end

config system probe-response
    set http-probe-value OK
    set mode http-probe
end

config system interface
    edit port1
        set mode static
        set ip 172.16.0.5 255.255.255.192
        set alias external
        set description external
        set allowaccess probe-response fgfm
    next
    edit port2
        set mode static
        set ip 172.16.0.69 255.255.255.192
        set alias internal
        set description internal
        set allowaccess probe-response fgfm
    next
    edit port3
        set mode static
        set ip 172.16.0.133 255.255.255.192
        set alias hasync
        set description hasync
    next
    edit port4
        set mode static
        set ip 172.16.0.197 255.255.255.192
        set alias mgmt
        set description mgmt
        set allowaccess ping https ssh ftm
    next
end

config system ha
    set group-name AzureHA
    set mode a-p
    set hbdev port3 100
    set session-pickup enable
    set session-pickup-connectionless enable
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface port4
            set gateway 172.16.0.193
        next
    end
    set override disable
    set unicast-hb enable
    set priority 1
    set unicast-hb-peerip 172.16.0.132
    set password 123Password$%^
end






--==FGTCONF==--
